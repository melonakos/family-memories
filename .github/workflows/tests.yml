name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. Catches an osxphotos release renaming something we depend on,
    # rather than discovering it mid-export on someone else's Mac.
    - cron: "0 6 * * 1"

concurrency:
  # Event is part of the key so a manual macOS dispatch and an ordinary push
  # don't cancel one another — they test different things.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The copy contract is pure Python, so the whole suite except the osxphotos
  # integration runs here, across every supported Python version.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # Resolves the two things that cannot be checked off a Mac: that osxphotos
  # still spells its export flags the way we expect, and that a real PhotoInfo
  # still carries every property the contract reads.
  #
  # Runs on every push across both runner images. Standard macOS runners are
  # free and unlimited on public repositories, so there is no reason to ration
  # the one check that has actually caught a bug.
  osxphotos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with macOS extras
        run: pip install -e ".[dev,macos]"

      - name: Report the osxphotos version under test
        run: |
          python -c "import osxphotos; print('osxphotos', osxphotos.__version__)"
          osxphotos --version || true

      # These bundles are ordinary directories, not the TCC-protected system
      # library, so they open without Full Disk Access on a headless runner.
      # This is how osxphotos tests itself. Chosen to cover the properties the
      # contract actually depends on: face tags, shared items, cloud-only
      # originals, live photos, media types, and the newest Photos schema.
      - name: Fetch Photos library fixtures
        uses: actions/checkout@v4
        with:
          repository: RhetTbull/osxphotos
          path: osxphotos-fixtures
          sparse-checkout: |
            tests/Test-26.1.photoslibrary
            tests/Test-Faces-10.15.7.photoslibrary
            tests/Test-Shared-10.15.1.photoslibrary
            tests/Test-Cloud-13.1.photoslibrary
            tests/Test-Live-15.7.2.photoslibrary
            tests/Test-Media-Types-15.7.2.photoslibrary

      - name: List the fixtures that arrived
        run: ls -d osxphotos-fixtures/tests/*.photoslibrary || echo "none fetched"

      - name: Diagnose what osxphotos sees in each fixture
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import osxphotos

          for lib in sorted(Path("osxphotos-fixtures/tests").glob("*.photoslibrary")):
              try:
                  db = osxphotos.PhotosDB(str(lib))
                  print(
                      f"{lib.name:38} ver={getattr(db, 'photos_version', '?')} "
                      f"plain={len(db.photos())} "
                      f"movies={len(db.photos(movies=True))} "
                      f"all={len(db.photos(movies=True, intrash=True))} "
                      f"persons={len(db.persons)} albums={len(db.album_info)}"
                  )
              except Exception as exc:
                  print(f"{lib.name:38} ERROR {type(exc).__name__}: {exc}")
          PY

      - name: Full suite, including macOS integration
        env:
          OSXPHOTOS_TEST_LIBRARIES: osxphotos-fixtures/tests
        run: pytest -q -rs

      - name: Inventory dry run against a real Photos library
        env:
          OSXPHOTOS_TEST_LIBRARIES: osxphotos-fixtures/tests
        run: |
          cp config.example.toml config.toml
          python cli.py contribute inventory \
            --config config.toml \
            --library osxphotos-fixtures/tests/Test-Faces-10.15.7.photoslibrary
