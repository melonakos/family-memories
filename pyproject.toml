[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-memories"
version = "0.1.0"
description = "Consolidate a family's photos into a permanent searchable archive, and select prints for a gallery wall"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    # Perceptual hashing for near-duplicate detection. Core rather than optional
    # since ingest cannot do its job without it.
    "Pillow>=10.2",
    "ImageHash>=4.3",
]

[project.optional-dependencies]
# osxphotos is macOS-only. Everything under contribute/ and the living-library
# leg of ingest/ needs it; the vault, index, and dedupe do not.
macos = ["osxphotos>=0.68"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
family-memories = "cli:main"

[tool.setuptools]
packages = ["contribute", "vault", "index", "ingest", "enrich", "heritage"]
py-modules = ["cli", "settings", "mediafiles"]

[tool.setuptools.package-data]
# The schema ships with the package; db.py reads it at first run.
index = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
